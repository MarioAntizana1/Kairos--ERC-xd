name: CI

on:
  push:
  pull_request:

jobs:
  docs-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static tooling
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML xacro ruff

      - name: Validate documentation, assets, tests and syntax
        run: make check

      - name: Validate URDF/Xacro
        run: make urdf-check

      - name: Run energy model
        run: make energy > /tmp/energy-report.md

      - name: Upload energy report
        uses: actions/upload-artifact@v4
        with:
          name: energy-report
          path: /tmp/energy-report.md
